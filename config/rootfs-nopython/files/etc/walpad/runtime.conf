# No-Python image: every subsystem is Rust, there is no Python to fall back to.  If walpad-core or
# walpad-shell is missing, lacks its capability, or keeps crashing, the session stops and the
# padui rescue screen takes over (see usr/local/sbin/walpad-rescue).
WALPAD_DEVICE=rust
WALPAD_INPUT=rust
WALPAD_SHELL=rust
WALPAD_SHADOW=0
