# WalPad touch bindings (the OS gesture layer turns a tap into a left click, a one-finger drag into
# wheel events and a two-finger pinch into Ctrl + wheel). The OSC's own buttons keep their clicks:
# its forced mouse areas win over these bindings.
MBTN_LEFT      script-binding touch/tap
MBTN_LEFT_DBL  script-binding touch/double
ESC            script-binding touch/back

# vertical drag: volume; horizontal drag: seek
WHEEL_UP       add volume 2
WHEEL_DOWN     add volume -2
WHEEL_LEFT     seek -5
WHEEL_RIGHT    seek 5
# pinch: zoom the picture (Ctrl + wheel), reset with the key below
Ctrl+WHEEL_UP    add video-zoom 0.05
Ctrl+WHEEL_DOWN  add video-zoom -0.05
0              set video-zoom 0 ; set video-pan-x 0 ; set video-pan-y 0

# the keyboard still works
SPACE          cycle pause
f              cycle fullscreen
q              quit
LEFT           seek -10
RIGHT          seek 10
UP             add volume 5
DOWN           add volume -5
m              cycle mute
