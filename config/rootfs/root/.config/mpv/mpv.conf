# WalPad 8G media player (owner request 2026-11-11, change media-apps-capture; docs/41-media.md).
# 4 GB RAM, 8 x Cortex-A53, no GPU userspace: everything is software.

# --- video: software decoding, plain X11 output (no OpenGL: Mesa is llvmpipe only)
vo=x11
hwdec=no
vd-lavc-threads=4
vd-lavc-fast=yes
vd-lavc-skiploopfilter=nonref
sws-scaler=fast-bilinear
framedrop=vo
video-sync=audio

# --- audio: the system PulseAudio daemon on the safe 44.1 kHz ALSA plug (asound.conf); never a
# raw hw device at another rate (hangs the legacy mt-soc driver)
ao=pulse
audio-samplerate=44100
audio-channels=stereo
audio-format=s16
volume=100
volume-max=100

# --- cache sized for 4 GB RAM shared with Firefox and the shell
cache=yes
cache-secs=30
demuxer-max-bytes=48MiB
demuxer-max-back-bytes=16MiB

# --- window: no title bar (the shell's Back control sends Esc; see input.conf), touch-size OSC
force-window=yes
border=no
keepaspect-window=no
autofit=100%x100%
cursor-autohide=1500
audio-display=embedded-first
image-display-duration=inf
osd-font=DejaVu Sans
osd-bar=yes
osd-on-seek=bar
osd-font-size=40
sub-font=DejaVu Sans
sub-font-size=46
sub-auto=fuzzy
screenshot-directory=/root/Pictures
save-position-on-quit=no
msg-level=all=warn

# --- on-screen controller: the stock OSC with large buttons (about 2x), one bottom bar.
# The OSC shows when the screen is touched and hides after 6 s.
osc=yes
script-opts=osc-layout=bottombar,osc-scalewindow=2,osc-scalefullscreen=2,osc-vidscale=no,osc-hidetimeout=6000,osc-fadeduration=200,osc-seekbarstyle=bar,osc-boxalpha=170,osc-visibility=auto
