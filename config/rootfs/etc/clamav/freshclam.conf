# WalPad 8G: owner request 2026-11-13 ("a virus scanner tha if i need that then i will abal to
# use that") - freshclam downloads the virus signature database on demand (walpad-scan update),
# never on its own; nothing here runs at boot.
#
# This image builds every package with --no-scripts (scripts/build_rootfs.sh), so the apk
# post-install step that would normally create a "clamav" system user never runs - there is no
# such user anywhere in this image. Every scan here already runs as root (the only user this OS
# has), so DatabaseOwner is root instead of the package's own default ("clamav", a user that
# does not exist on this image and would make freshclam refuse to start).
DatabaseOwner root
DatabaseMirror database.clamav.net
ScriptedUpdates yes
PidFile /run/clamav/freshclam.pid
DatabaseDirectory /var/lib/clamav
