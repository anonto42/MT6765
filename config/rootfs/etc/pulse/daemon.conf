# WalPad 8G PulseAudio (system-wide daemon, started by walpad-sound).  The legacy mt-soc codec driver
# only plays 44.1 kHz S16 stereo safely (other rates hung the tablet): everything is resampled to it.
daemonize = yes
system-instance = yes
disallow-exit = yes
exit-idle-time = -1
# no udev, no X11 session, no realtime: a small, boring daemon (realtime-scheduling = yes can watchdog-reboot mt-soc)
high-priority = no
realtime-scheduling = no
# the daemon runs as user pulse, clients as root: no shared-memory transport between them
enable-shm = no
enable-memfd = no
flat-volumes = no
default-sample-format = s16le
default-sample-rate = 44100
alternate-sample-rate = 44100
default-sample-channels = 2
resample-method = speex-float-1
default-fragments = 4
default-fragment-size-msec = 25
log-target = file:/run/pulse/pulseaudio.log
log-level = notice
