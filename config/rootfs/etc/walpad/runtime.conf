# Runtime selection per subsystem (python = current default, rust = new).  A rebuilt image
# never switches by surprise; flip one line and restart the component to switch (rollback = flip back).
WALPAD_DEVICE=python
WALPAD_INPUT=python
WALPAD_SHELL=python
# 1 = Rust core reads the same hardware, logs "WOULD <action>" and writes nothing
WALPAD_SHADOW=0
