# WalPad 8G: wraps the "terminal" app's st (owner report 2026-11-13, "normal terminal need
# scrollable feature" - st itself has no scrollback at all, suckless philosophy). Touch-drag
# scrolls once apps.json has "touch": "scroll" for that app (one-finger drag = scroll wheel,
# which mouse mode below turns into entering/scrolling copy-mode automatically).
set -g mouse on
set -g default-shell /usr/bin/fish
set -g history-limit 10000
# No second status line: the shell's own window bar already shows app/window info, and this
# app only ever runs one tmux session per st window (no tabs/panes to label here).
set -g status off
# Owner report 2026-11-13 ("long press on terminal... hilighted sections... vanising again...
# not getting the tool bar open"): tmux 3.7c's own built-in double/triple-click bindings
# (`tmux list-keys -T root`) already select the word/line and call copy-pipe-and-cancel with NO
# command - which, with no copy-command set, only ever reached tmux's own internal paste buffer.
# The owner's long-press (a double click, change long-press-selects-text) genuinely DID select a
# word every time; it just never left tmux, so neither the X CLIPBOARD (paste elsewhere) nor the
# PRIMARY selection (what makes the shell's own toolbar appear, seltools.rs) ever saw it, and
# copy-pipe-and-cancel's own copy-mode exit makes the on-screen highlight disappear right after -
# "highlighted then vanishing" with no toolbar, exactly as reported. copy-command applies to
# every copy-pipe call that doesn't name its own command (the default double/triple-click
# bindings above, and the two explicit ones below), writing to both: PRIMARY so the toolbar
# shows, CLIPBOARD so Ctrl+Shift+V / the toolbar's own Paste button can read it back anywhere.
# A tee/process-substitution one-liner looked right but only ever set PRIMARY, confirmed live:
# /bin/sh here is busybox ash, and xclip daemonises (forks to stay alive as the selection
# owner) after reading stdin - with `tee >(...) | xclip`, the second xclip (the tail of the
# main pipe) was getting torn down before that fork completed often enough to come back empty
# every time tried. A temp file read by each xclip in turn has no such race.
set -g copy-command "sh -c 'f=\$(mktemp); cat > \"\$f\"; xclip -i -selection primary < \"\$f\" >/dev/null 2>&1; xclip -i -selection clipboard < \"\$f\" >/dev/null 2>&1; rm -f \"\$f\"'"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel
