# WalPad 8G: every program plays through the MediaTek codec at 44.1 kHz (the legacy mt-soc driver
# hung the tablet when asked for 48 kHz on hw:0,0; plug converts any rate/format to this).
# walpad_out is the one safe path: ALSA programs use it as `default`, the PulseAudio sink opens it by
# name (never a name that a pulse-to-ALSA plugin could redirect back to pulse).
pcm.walpad_out {
  type plug
  slave {
    pcm "hw:0,0"
    rate 44100
    format S16_LE
    channels 2
    # the driver rejects its own default period/buffer (9216 frames); 25 ms periods, 100 ms buffer work
    period_time 25000
    buffer_time 100000
  }
}
pcm.!default {
  type plug
  slave.pcm "walpad_out"
}
ctl.!default {
  type hw
  card 0
}
