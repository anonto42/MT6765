# WalPad 8G: ALSA programs play through the MediaTek codec at 44.1 kHz S16 stereo (the legacy
# mt-soc driver hung the tablet when asked for 48 kHz on hw:0,0; plug converts any rate/format).
# Do NOT put period_time/buffer_time in a plug slave: alsa-lib answers "Unknown field period_time"
# and every client fails to open the device.  dmix is no option either (no SysV IPC in this kernel).
# The PulseAudio sink (system.pa) opens hw:0,0 itself with fixed rate/format and its own
# fragments (4 x 4408 bytes = 25 ms periods, 100 ms buffer), which the driver accepts.
pcm.walpad_out {
  type plug
  slave {
    pcm "hw:0,0"
    rate 44100
    format S16_LE
    channels 2
  }
}
pcm.!default {
  type plug
  slave.pcm "walpad_out"
}
ctl.!default {
  type hw
  card 0
}

# Capture (owner request 2026-11-12, change headphone-mic-jack): the codec's capture PCM is a
# separate ALSA device, hw:0,1 (`00-01: MultiMedia1_Capture` in /proc/asound/pcm), not hw:0,0.
# Which physical mic feeds it (built-in vs. headset) is chosen by walpad-audio's mixer switches,
# not by this PCM; kept at the same safe 44.1 kHz S16 stereo as playback.
pcm.walpad_in {
  type plug
  slave {
    pcm "hw:0,1"
    rate 44100
    format S16_LE
    channels 2
  }
}
