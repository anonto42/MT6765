[package]
name = "walpad-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
walpad-proto = { path = "../walpad-proto" }
walpad-hw = { path = "../walpad-hw" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "1", features = ["fs", "event", "std", "process"] }
x11rb = { version = "0.13", default-features = false, features = ["xtest"] }
# WPA2 passphrase -> PSK (PBKDF2-HMAC-SHA1, 4096 rounds): pure Rust, no -sys crates
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
hmac = "0.12"
